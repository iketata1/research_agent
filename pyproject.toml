[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-intelligence-agent"
version = "0.1.0"
description = "Agent de veille autonome pour Intra-Air (recherche, marches publics, actualite, veille juridique)."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
